<!doctype html>
<meta charset="utf-8">
<title>Sinaptik Social logo</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  section { padding: 32px; }
  .dark { background: #0F172A; }
  .light { background: #F8FAFC; }
  .row { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
  img { height: 88px; width: auto; }
  img.stack { height: 220px; }
</style>
<section class="dark">
  <div class="row">
    <img src="mark.svg" alt="mark on navy">
    <img src="lockup-horizontal.svg" alt="horizontal on navy">
    <img class="stack" src="lockup-stacked.svg" alt="stacked on navy">
  </div>
</section>
<section class="light">
  <div class="row">
    <img src="mark.svg" alt="mark on light">
    <img src="lockup-horizontal-light.svg" alt="horizontal on light">
    <img class="stack" src="lockup-stacked-light.svg" alt="stacked on light">
  </div>
</section>
