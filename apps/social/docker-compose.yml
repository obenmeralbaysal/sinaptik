services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sinapp-social-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=${APP_ENV}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    ports:
      - "9000:9000"
    networks:
      - bot_net

  web:
    image: nginx:alpine
    container_name: sinapp-social-web
    restart: unless-stopped
    ports:
      - "9090:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - bot_net

  db:
    image: mysql:8.0
    container_name: sinapp-social-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "33066:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - bot_net

  pma:
    image: phpmyadmin/phpmyadmin
    container_name: sinapp-social-pma
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    networks:
      - bot_net

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sinapp-social-worker
    restart: unless-stopped
    command: [ "cron", "-f" ]
    volumes:
      - .:/var/www/html
      - ./docker/php/crontab:/etc/cron.d/app-cron
    environment:
      - APP_ENV=${APP_ENV}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - bot_net

networks:
  bot_net:
    driver: bridge

volumes:
  dbdata:
