server {
    listen 8080;
    server_name _;
    client_max_body_size 128m;
    root /usr/share/nginx/html;

    location /api/ { try_files $uri @laravel; }
    location /sanctum/ { try_files $uri @laravel; }
    location /admin { try_files $uri @laravel; }
    location /livewire { try_files $uri @laravel; }
    location /horizon { try_files $uri @laravel; }
    location /mcp { try_files $uri @laravel; }
    location = /up { try_files $uri @laravel; }

    location /js/ { try_files $uri =404; }
    location /css/ { try_files $uri =404; }
    location /fonts/ { try_files $uri =404; }
    location /vendor/ { try_files $uri =404; }
    location /favicon.ico { try_files $uri =404; }

    location @laravel {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 120s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
