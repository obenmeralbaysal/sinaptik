# Host PHPUnit reaches Postgres and Redis on localhost. Not loaded by default
# so the app network stays internal. Use:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d db redis
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
