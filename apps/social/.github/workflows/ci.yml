name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sinsocial
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sinsocial"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, redis, intl, gd, zip, bcmath
          coverage: none
      - name: Create the non-superuser application role
        run: |
          PGPASSWORD=secret psql -h 127.0.0.1 -U sinsocial -d postgres -c "CREATE ROLE sinsocial_app LOGIN PASSWORD 'secret' NOSUPERUSER NOBYPASSRLS NOCREATEDB;"
          PGPASSWORD=secret psql -h 127.0.0.1 -U sinsocial -d postgres -c "CREATE DATABASE sinsocial_test OWNER sinsocial_app;"
          PGPASSWORD=secret psql -h 127.0.0.1 -U sinsocial -d sinsocial_test -c "ALTER SCHEMA public OWNER TO sinsocial_app;"
      - name: Install and test
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          php artisan test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
