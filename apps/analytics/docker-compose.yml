services:
  postgres:
    image: postgres:16-alpine
    container_name: sinaptik-analytics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${HOST_PORT_POSTGRES}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [analytics]

  redis:
    image: redis:7-alpine
    container_name: sinaptik-analytics-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${HOST_PORT_REDIS}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [analytics]

  mailhog:
    image: mailhog/mailhog
    container_name: sinaptik-analytics-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT_MAILHOG_SMTP}:1025"
      - "127.0.0.1:${HOST_PORT_MAILHOG_UI}:8025"
    networks: [analytics]

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: sinaptik-analytics-backend:latest
    container_name: sinaptik-analytics-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${HOST_PORT_BACKEND}:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/html/storage
    networks: [analytics]

  horizon:
    build:
      context: .
      dockerfile: docker/horizon/Dockerfile
      args:
        BACKEND_IMAGE: sinaptik-analytics-backend:latest
    image: sinaptik-analytics-horizon:latest
    container_name: sinaptik-analytics-horizon
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
    depends_on:
      - backend
      - redis
    volumes:
      - backend_storage:/var/www/html/storage
    networks: [analytics]

  scheduler:
    build:
      context: .
      dockerfile: docker/scheduler/Dockerfile
      args:
        BACKEND_IMAGE: sinaptik-analytics-backend:latest
    image: sinaptik-analytics-scheduler:latest
    container_name: sinaptik-analytics-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
    depends_on:
      - backend
    volumes:
      - backend_storage:/var/www/html/storage
    networks: [analytics]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:80}
    image: sinaptik-analytics-frontend:latest
    container_name: sinaptik-analytics-frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${HOST_PORT_FRONTEND}:3000"
    depends_on:
      - backend
    networks: [analytics]

volumes:
  pgdata:
  redisdata:
  backend_storage:

networks:
  analytics:
    driver: bridge
