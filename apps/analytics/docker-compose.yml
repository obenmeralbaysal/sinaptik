services:
  postgres:
    image: postgres:16-alpine
    container_name: sinaptik-analytics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${HOST_PORT_POSTGRES}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [analytics]

  redis:
    image: redis:7-alpine
    container_name: sinaptik-analytics-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${HOST_PORT_REDIS}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [analytics]

  mailhog:
    image: mailhog/mailhog
    container_name: sinaptik-analytics-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT_MAILHOG_SMTP}:1025"
      - "127.0.0.1:${HOST_PORT_MAILHOG_UI}:8025"
    networks: [analytics]

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: sinaptik-analytics-backend:latest
    container_name: sinaptik-analytics-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${HOST_PORT_BACKEND}:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/html/storage
    networks: [analytics]

  horizon:
    build:
      context: .
      dockerfile: docker/horizon/Dockerfile
      args:
        BACKEND_IMAGE: sinaptik-analytics-backend:latest
    image: sinaptik-analytics-horizon:latest
    container_name: sinaptik-analytics-horizon
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
    depends_on:
      - backend
      - redis
    volumes:
      - backend_storage:/var/www/html/storage
    networks: [analytics]

  scheduler:
    build:
      context: .
      dockerfile: docker/scheduler/Dockerfile
      args:
        BACKEND_IMAGE: sinaptik-analytics-backend:latest
    image: sinaptik-analytics-scheduler:latest
    container_name: sinaptik-analytics-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
    depends_on:
      - backend
    volumes:
      - backend_storage:/var/www/html/storage
    networks: [analytics]

  # Yerel IdP. Yalnızca `docker compose --profile sso up` ile açılır.
  # Masterkey ve parolalar .env içindedir; bu dosyada secret yoktur.
  zitadel:
    profiles: ["sso"]
    image: ghcr.io/zitadel/zitadel:v2.66.4
    container_name: sinaptik-analytics-zitadel
    restart: unless-stopped
    command: ["start-from-init", "--masterkey", "${ZITADEL_MASTERKEY:-}", "--tlsMode", "disabled"]
    environment:
      ZITADEL_PORT: "8080"
      ZITADEL_EXTERNALDOMAIN: 127.0.0.1
      ZITADEL_EXTERNALPORT: "${HOST_PORT_ZITADEL:-8127}"
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${DB_USERNAME}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${DB_PASSWORD:-}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD:-}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Sinaptik
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME:-}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${HOST_PORT_ZITADEL:-8127}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [analytics]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:80}
    image: sinaptik-analytics-frontend:latest
    container_name: sinaptik-analytics-frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${HOST_PORT_FRONTEND}:3000"
    depends_on:
      - backend
    networks: [analytics]

volumes:
  pgdata:
  redisdata:
  backend_storage:

networks:
  analytics:
    driver: bridge
